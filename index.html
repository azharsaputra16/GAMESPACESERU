<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>GALAXIAN CLONE</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="game-wrapper">

        <!-- HUD -->
        <div id="hud">

            <div class="hud-box">
                <span class="hud-label">SCORE</span>
                <span id="scoreDisplay">0</span>
            </div>

            <div class="hud-box">
                <span class="hud-label">WAVE</span>
                <span id="waveDisplay">1</span>
            </div>

            <div class="hud-box">
                <span class="hud-label">HIGH SCORE</span>
                <span id="highScoreDisplay">0</span>
            </div>

            <div class="hud-box">
                <span class="hud-label">NYAWA</span>
                <span id="livesDisplay">❤️❤️❤️</span>
            </div>

            <button id="pauseButton" type="button">
                ⏸
            </button>

        </div>


        <!-- AREA GAME -->
        <div id="game-container">

            <canvas id="gameCanvas"
                    width="500"
                    height="600">
            </canvas>


            <!-- START SCREEN -->
            <div id="startScreen" class="overlay">

                <div class="menu-box">

                    <h1>🚀 GALAXIAN</h1>

                    <p class="subtitle">
                        SPACE DEFENDER
                    </p>

                    <p>
                        Hancurkan semua alien dan bertahan
                        selama mungkin!
                    </p>

                    <button id="startButton" class="menu-button">
                        ▶ MULAI GAME
                    </button>

                    <p class="instruction">
                        PC: ← → + SPACE
                        <br>
                        HP: Gunakan tombol di bawah
                    </p>

                </div>

            </div>


            <!-- PAUSE SCREEN -->
            <div id="pauseScreen" class="overlay hidden">

                <div class="menu-box">

                    <h2>⏸ GAME PAUSED</h2>

                    <button id="resumeButton" class="menu-button">
                        ▶ LANJUTKAN
                    </button>

                </div>

            </div>


            <!-- GAME OVER -->
            <div id="gameOverScreen" class="overlay hidden">

                <div class="menu-box">

                    <h1>💥 GAME OVER</h1>

                    <p>
                        Score:
                        <strong id="finalScore">0</strong>
                    </p>

                    <p>
                        Wave:
                        <strong id="finalWave">1</strong>
                    </p>

                    <button id="restartButton" class="menu-button">
                        🔄 MAIN LAGI
                    </button>

                </div>

            </div>

        </div>


        <!-- TOUCH CONTROLS -->
        <div id="touch-controls">

            <!-- KIRI: GERAK -->
            <div class="movement-controls">

                <button
                    id="leftButton"
                    class="control-button"
                    type="button"
                    aria-label="Gerak ke kiri">
                    ◀
                </button>

                <button
                    id="rightButton"
                    class="control-button"
                    type="button"
                    aria-label="Gerak ke kanan">
                    ▶
                </button>

            </div>


            <!-- KANAN: TEMBAK -->
            <button
                id="shootButton"
                class="shoot-button"
                type="button"
                aria-label="Tembak">

                🔥
                <span>TEMBAK</span>

            </button>

        </div>

    </div>


    <script src="game.js"></script>

</body>
</html>
